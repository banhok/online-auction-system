name: Java CI/CD

on:
  push:
    branches: [ main, develop, develop-v2 ]
  pull_request:
    branches: [ main, develop, develop-v2 ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build project
        run: mvn clean compile -B

      - name: Run tests + verify coverage
        run: mvn verify -B

      - name: Package
        run: mvn package -DskipTests -B
