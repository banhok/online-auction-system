name: Java CI/CD

on:
  push:
    branches: [ main, develop, develop-v2 ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Verify Java version
        run: |
          java -version
          mvn -version

      - name: Build project
        run: mvn clean compile -B -DskipTests -Dmaven.compiler.source=17 -Dmaven.compiler.target=17

      - name: Run tests
        run: mvn test -B
        continue-on-error: true

      - name: Package
        run: mvn package -DskipTests -B
